
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Slice Arcade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10152d;color:white;font-family:Arial;text-align:center}
header{padding:15px}
h1{color:#ffe45e;margin:10px}
.info{display:flex;justify-content:space-around;font-size:19px;margin:15px}
button{background:#ffcc35;border:0;padding:13px 25px;border-radius:12px;font-weight:bold;font-size:17px;margin:8px}
canvas{display:block;width:100%;height:65vh;touch-action:none;background:linear-gradient(#172b50,#071329);border-radius:18px}
#message{font-size:20px;padding:12px}
</style>
</head>
<body>
<header>
<h1>🍉 FRUIT SLICE 🍊</h1>
<div class="info">
<span>Score: <b id="score">0</b></span>
<span>Time: <b id="time">60</b></span>
</div>
<button id="start">START GAME</button>
<button id="pause">PAUSE</button>
<div id="message">Slice fruits with your finger!</div>
</header>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const msg=document.getElementById("message");

let fruits=[],score=0,time=60,playing=false,paused=false;
let last=0,spawn=0,frame=0,trail=[];
const emojis=["🍉","🍊","🍎","🍌","🍓","🍍","🥝"];

function resize(){
 const r=canvas.getBoundingClientRect();
 canvas.width=r.width*devicePixelRatio;
 canvas.height=r.height*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize",resize);
resize();

function start(){
 score=0;time=60;fruits=[];spawn=0;frame=0;
 playing=true;paused=false;
 scoreEl.textContent=score;timeEl.textContent=time;
 msg.textContent="Swipe across the fruits!";
 last=performance.now();
 requestAnimationFrame(loop);
}
function finish(){
 playing=false;
 msg.textContent="GAME OVER! Final Score: "+score;
}
function pause(){
 if(!playing)return;
 paused=!paused;
 msg.textContent=paused?"PAUSED":"Keep slicing!";
 if(!paused){last=performance.now();requestAnimationFrame(loop);}
}
function loop(now){
 if(!playing||paused)return;
 let dt=Math.min((now-last)/1000,.05);
 last=now;
 frame+=dt;spawn+=dt;
 if(frame>=1){
 time=Math.max(0,60-Math.floor(frame));
 timeEl.textContent=time;
 if(time===0){finish();return;}
 }
 if(spawn>.65){
 spawn=0;
 const w=canvas.clientWidth,h=canvas.clientHeight;
 fruits.push({x:35+Math.random()*(w-70),y:h+20,
 vx:(Math.random()-.5)*170,vy:-430-Math.random()*100,
 size:27,emoji:emojis[Math.floor(Math.random()*emojis.length)]});
 }
 ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
 fruits=fruits.filter(f=>f.y<canvas.clientHeight+60);
 for(const f of fruits){
 f.x+=f.vx*dt;f.y+=f.vy*dt;
 f.vy+=750*dt;
 ctx.font="42px Arial";ctx.textAlign="center";
 ctx.fillText(f.emoji,f.x,f.y);
 }
 trail=trail.filter(p=>now-p.t<180);
 ctx.strokeStyle="#fff36a";ctx.lineWidth=5;
 ctx.lineCap="round";ctx.beginPath();
 trail.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
 ctx.stroke();
 requestAnimationFrame(loop);
}
let swiping=false;
function position(e){
 const r=canvas.getBoundingClientRect();
 return {x:e.clientX-r.left,y:e.clientY-r.top};
}
canvas.addEventListener("pointerdown",e=>{
 if(!playing||paused)return;
 swiping=true;canvas.setPointerCapture(e.pointerId);
 trail=[{...position(e),t:performance.now()}];
});
canvas.addEventListener("pointermove",e=>{
 if(!swiping||!playing||paused)return;
 const p=position(e);p.t=performance.now();trail.push(p);
 fruits=fruits.filter(f=>{
 const hit=Math.hypot(f.x-p.x,f.y-p.y)<f.size+22;
 if(hit){score+=10;scoreEl.textContent=score;}
 return !hit;
 });
});
canvas.addEventListener("pointerup",()=>swiping=false);
canvas.addEventListener("pointercancel",()=>swiping=false);
document.getElementById("start").onclick=start;
document.getElementById("pause").onclick=pause;
</script>
</body>
</html>
