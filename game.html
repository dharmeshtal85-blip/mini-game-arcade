
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a12">
<title>Play Game – Crazy Mini Games</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#090a12;color:#f7f7fb;font-family:Arial,sans-serif}
a{color:inherit;text-decoration:none}
header{height:65px;background:#10111d;border-bottom:1px solid #292a40;display:flex;align-items:center;padding:0 max(14px,calc((100% - 1100px)/2));gap:15px}
.back{font-size:28px}
.brand{font-size:19px;font-weight:1000}
.brand span{color:#a58bff}
main{max-width:1100px;margin:auto;padding:20px 16px 50px}
.frame{background:#171827;border-radius:17px;overflow:hidden}
.bar{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar h1{font-size:23px}
.bar small{color:#a8a9bd}
.bar button,.vote{border:0;border-radius:10px;background:#292a42;color:white;padding:11px 14px;font-weight:800}
iframe{width:100%;height:min(72vh,680px);min-height:400px;border:0;display:block;background:#080a12}
.details{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:16px}
.panel{background:#171827;border:1px solid #292a40;border-radius:16px;padding:19px}
.panel h2{font-size:21px;margin-bottom:12px}
.muted{color:#a8a9bd;line-height:1.55}
.votes{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}
.vote{font-size:15px;cursor:pointer}
.vote.active{background:#5136bb;outline:2px solid #a58bff}
.vote:disabled{opacity:.55;cursor:wait}
.stats{color:#ffe27a;font-size:13px;line-height:1.6}
.steps{color:#dedfeb;line-height:1.8;padding-left:22px}
.steps li{margin:5px 0}
.more{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.more a{background:#27283e;padding:12px;border-radius:10px;font-size:13px}
@media(max-width:700px){
main{padding:12px 10px 35px}
.details{grid-template-columns:1fr}
.bar{align-items:flex-start;flex-direction:column}
.bar h1{font-size:20px}
iframe{height:65vh;min-height:370px}
}
</style>
</head>

<body>
<header>
<a class="back" href="index.html">‹</a>
<a class="brand" href="index.html">CRAZY <span>MINI GAMES</span></a>
</header>

<main>
<section class="frame">
<div class="bar">
<div>
<h1 id="title">Game</h1>
<small id="category"></small>
</div>
<div>
<button id="reloadBtn">↻ Reload</button>
<button id="fullscreenBtn">⛶ Fullscreen</button>
</div>
</div>
<iframe id="player" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
</section>

<section class="details">
<div class="panel">
<h2>👍 Rate this game</h2>
<p class="muted">Like or dislike this game. Your vote is saved securely and the total votes are shared with all visitors.</p>
<div class="votes">
<button class="vote" id="like" disabled>👍 Like <span id="likes">0</span></button>
<button class="vote" id="dislike" disabled>👎 Dislike <span id="dislikes">0</span></button>
</div>
<div class="stats" id="rating">Connecting to voting system...</div>
</div>

<div class="panel">
<h2>How to Play</h2>
<ol class="steps" id="steps"></ol>
<p class="muted" id="controls"></p>
</div>
</section>

<section class="panel" style="margin-top:16px">
<h2>More Games</h2>
<div class="more" id="more"></div>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  getFirestore,
  collection,
  doc,
  setDoc,
  getDoc,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCSObEJvRWKJJGY688nGutWc4r1X35jDj4",
  authDomain: "crazy-mini-games.firebaseapp.com",
  databaseURL: "https://crazy-mini-games-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "crazy-mini-games",
  storageBucket: "crazy-mini-games.firebasestorage.app",
  messagingSenderId: "314808930347",
  appId: "1:314808930347:web:8869f160cd860a3ba61a6e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* GAME LIST */
const games = {
  "2048": {
    name:"2048 Puzzle",
    file:"2048.html",
    cat:"Puzzle",
    steps:[
      "Swipe or use arrow keys to move the tiles.",
      "Matching numbers merge into one larger number.",
      "Keep merging tiles and try to reach 2048."
    ],
    controls:"Controls: Swipe on mobile or use arrow keys on desktop."
  },
  "sniper": {
    name:"Sniper Ghost 3D",
    file:"sniper-ghost-3d.html",
    cat:"Action",
    steps:[
      "Wait for the level to load.",
      "Aim carefully at the targets.",
      "Use the game controls to shoot and complete the objective."
    ],
    controls:"Controls: Follow the on-screen game prompts."
  },
  "neonwaves": {
    name:"Neon Waves Overdrive",
    file:"neon-waves-overdrive.html",
    cat:"Arcade",
    steps:[
      "Tap and hold to guide the wave upward.",
      "Release to move downward and avoid hazards.",
      "Reach the finish without hitting obstacles."
    ],
    controls:"Controls: Touch and hold, or click and hold."
  },
  "neonroad": {
    name:"Neon Road Rush",
    file:"neon-road-rush.html",
    cat:"Racing",
    steps:[
      "Start driving and watch the road ahead.",
      "Steer to avoid obstacles.",
      "Stay on the road and try to beat your best score."
    ],
    controls:"Controls: Use the game's displayed touch or keyboard controls."
  },
  "blumi": {
    name:"Blumi Hill Racers",
    file:"blumi-hill-racers.html",
    cat:"Racing",
    steps:[
      "Accelerate to drive over the hills.",
      "Balance your vehicle over slopes.",
      "Avoid flipping and reach the finish."
    ],
    controls:"Controls: Use the in-game driving buttons or keyboard prompts."
  },
  "fruitpeel": {
    name:"Fruit Peel Factory 3D",
    file:"fruit-peel-factory.html",
    cat:"Simulation",
    steps:[
      "Drag the knife across the fruit to peel it.",
      "Move carefully over the fruit to increase the peel progress.",
      "Complete the peel target to move to the next fruit."
    ],
    controls:"Controls: Drag with your finger or mouse."
     },
    "popit": {
  name: "Pop It Fidget ASMR",
  file: "pop-it-fidget-asmr.html",
  cat: "Simulation",
  steps: [
    "Tap or slide your finger across the bubbles to pop them.",
    "Pop all bubbles to complete the shape.",
    "Use Next Shape to try another Pop It toy."
  ],
  controls: "Controls: Tap or drag your finger across the bubbles."
}
};

const params = new URLSearchParams(location.search);
const id = params.get("game") || "2048";
const g = games[id] || games["2048"];

document.title = g.name + " – Crazy Mini Games";
document.getElementById("title").textContent = g.name;
document.getElementById("category").textContent = g.cat + " · Play free online";
document.getElementById("player").src = g.file;
document.getElementById("steps").innerHTML =
  g.steps.map(s => "<li>" + s + "</li>").join("");
document.getElementById("controls").textContent = g.controls;

/* GAME BUTTONS */
document.getElementById("reloadBtn").addEventListener("click", () => {
  document.getElementById("player").src = g.file;
});

document.getElementById("fullscreenBtn").addEventListener("click", () => {
  document.getElementById("player").requestFullscreen?.();
});

/* MORE GAMES */
document.getElementById("more").innerHTML =
  Object.entries(games)
    .filter(([key]) => key !== id)
    .map(([key, game]) =>
      '<a href="game.html?game=' + key + '">' + game.name + '</a>'
    )
    .join("");

/* FIREBASE VOTING */
const likeButton = document.getElementById("like");
const dislikeButton = document.getElementById("dislike");
const likesText = document.getElementById("likes");
const dislikesText = document.getElementById("dislikes");
const ratingText = document.getElementById("rating");

let currentUser = null;
let currentChoice = "";
let voteDocuments = [];
let voteReady = false;
let voteBusy = false;

function renderVotes() {
  let likes = 0;
  let dislikes = 0;

  voteDocuments.forEach(item => {
    if (item.vote === "like") likes++;
    if (item.vote === "dislike") dislikes++;
  });

  likesText.textContent = likes;
  dislikesText.textContent = dislikes;

  likeButton.classList.toggle("active", currentChoice === "like");
  dislikeButton.classList.toggle("active", currentChoice === "dislike");

  const total = likes + dislikes;

  ratingText.textContent = total
    ? "👍 " + Math.round((likes / total) * 100) +
      "% positive · " + total + " total vote(s)"
    : "No votes yet";

  likeButton.disabled = !voteReady || voteBusy;
  dislikeButton.disabled = !voteReady || voteBusy;
}

async function submitVote(value) {
  if (!currentUser || voteBusy || !voteReady) return;
  if (currentChoice === value) return;

  voteBusy = true;
  renderVotes();

  try {
    const voteRef = doc(db, "games", id, "votes", currentUser.uid);

    await setDoc(voteRef, {
      vote: value,
      updatedAt: serverTimestamp()
    });

    currentChoice = value;
  } catch (error) {
    console.error("Vote error:", error);
    ratingText.textContent = "Vote could not be saved. Please try again.";
  } finally {
    voteBusy = false;
    renderVotes();
  }
}

likeButton.addEventListener("click", () => submitVote("like"));
dislikeButton.addEventListener("click", () => submitVote("dislike"));

async function startVoting() {
  try {
    ratingText.textContent = "Connecting to Firebase...";

    const result = await signInAnonymously(auth);
    currentUser = result.user;

    const userVoteRef = doc(db, "games", id, "votes", currentUser.uid);
    const existingVote = await getDoc(userVoteRef);

    if (existingVote.exists()) {
      currentChoice = existingVote.data().vote || "";
    }

    const votesRef = collection(db, "games", id, "votes");

    onSnapshot(votesRef, snapshot => {
      voteDocuments = snapshot.docs.map(d => d.data());
      voteReady = true;
      renderVotes();
    }, error => {
      console.error("Vote loading error:", error);
      ratingText.textContent = "Could not load votes. Check Firebase Rules.";
      voteReady = false;
      renderVotes();
    });

  } catch (error) {
    console.error("Firebase error:", error);
    ratingText.textContent =
      "Voting unavailable. Check Anonymous Authentication and Firestore Rules.";
    voteReady = false;
    renderVotes();
  }
}

renderVotes();
startVoting();

</script>
</body>
</html>
