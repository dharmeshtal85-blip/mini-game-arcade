<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fruit Peel Factory 3D</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Fredoka+One&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#263a43;font-family:Nunito,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:12px;max-width:620px;margin:auto}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start}
.box{background:#25100ceF;border:2px solid #ffffff35;border-radius:14px;padding:8px 10px;box-shadow:0 4px 12px #0005}
.box small{display:block;font-size:10px;color:#b9d3dc;letter-spacing:1px}
.box b{font-size:21px}
.title{text-align:center;font:23px 'Fredoka One';color:#ffe27a;text-shadow:0 3px 4px #0008;white-space:nowrap}
.title small{display:block;font:900 10px Nunito;color:#e1f1f3;letter-spacing:1px;margin-top:3px}
#progress{height:9px;width:min(34vw,190px);background:#172c52;border:1px solid #ffffff50;border-radius:20px;margin:8px auto;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ffb72e,#78e66e);transition:width .1s}
#knifeUpgrade{pointer-events:auto;align-self:flex-end;margin-top:10px;border:2px solid #ffe98a;border-radius:13px;padding:8px 12px;background:linear-gradient(#ffdf39,#ff9e00);color:#583000;font:900 13px Nunito;box-shadow:0 4px 0 #a75b00;min-width:110px}
#knifeUpgrade:active{transform:translateY(3px);box-shadow:0 1px 0 #a75b00}
#knifeLevel{font-size:10px;display:block}
.bottom{align-self:center;text-align:center;font-size:12px;font-weight:900;color:white;text-shadow:0 2px 5px #000;margin-bottom:10px}
#tip{background:#142b38c9;border:1px solid #ffffff40;border-radius:30px;padding:8px 14px}
#toast{position:absolute;top:44%;left:0;right:0;text-align:center;font:26px 'Fredoka One';color:#ffe98a;text-shadow:0 3px 8px #000;opacity:0;transition:.3s}
#toast.show{opacity:1;transform:scale(1.1)}
.modal{position:fixed;inset:0;z-index:5;background:#06131bdc;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hide{display:none}
.panel{width:min(100%,340px);background:linear-gradient(145deg,#1b5660,#172331);border:3px solid #71e3c2;border-radius:22px;padding:23px;text-align:center;box-shadow:0 20px 60px #0009}
.panel h2{font:28px 'Fredoka One';color:#ffe27a;margin:0 0 10px}
.panel p{font-size:13px;color:#d9ebee;line-height:1.5}
.panel button{width:100%;border:0;border-radius:13px;padding:13px;background:linear-gradient(#48e89a,#07985c);color:white;font:1000 17px Nunito}
  @media (max-width:600px){

  .top{
    display:grid !important;
    grid-template-columns:88px minmax(0,1fr) 88px !important;
    align-items:start !important;
    gap:6px !important;
    width:100% !important;
    padding:8px !important;
    box-sizing:border-box !important;
  }

  .top>.box{
    width:88px !important;
    min-width:0 !important;
    max-width:88px !important;
    padding:8px 5px !important;
    box-sizing:border-box !important;
  }

  .top>.title{
    min-width:0 !important;
    font-size:clamp(13px,4.2vw,19px) !important;
    text-align:center !important;
    overflow-wrap:anywhere;
  }

  .top>.title small{
    font-size:9px !important;
  }

  #knifeUpgrade{
    width:100% !important;
    font-size:10px !important;
    padding:7px 2px !important;
  }

  #knifeLevel{
    font-size:9px !important;
  }
  }
</style>
</head>

<body>
<canvas id="game"></canvas>

<div class="ui">
 <div class="top">
  <div class="box">
   <small>YOUR COINS</small>
   <b>🪙 <span id="coins">0</span></b>
  </div>

  <div class="title">
   FRUIT PEEL FACTORY
   <small id="fruitName">MANGO · FRUIT 01</small>
   <div id="progress"><div id="fill"></div></div>
  </div>

<div class="box" style="text-align:right;width:110px;min-width:0;max-width:110px;flex-shrink:0;box-sizing:border-box;">
   <small>LEVEL</small>
   <b id="level">01</b>
   <button id="knifeUpgrade">
    🗡️ UPGRADE
    <span id="knifeLevel">LV 1 · 50 🪙</span>
   </button>
  </div>
 </div>

 <div id="toast">✨ PERFECT PEEL! ✨</div>

 <div class="bottom">
  <span id="tip">👆 DRAG THE KNIFE ACROSS THE FRUIT</span>
 </div>
</div>

<div class="modal" id="welcome">
 <div class="panel">
  <h2>🍊 FRUIT PEEL FACTORY</h2>
  <p>Use your knife to peel the entire fruit. Watch the clean fruit fall into the flowing river!</p>
  <button id="play">START GAME</button>
 </div>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('game');

const fruits=[
 {name:'MANGO',skin:'#ff9d26',inside:'#ffe66b',shape:[1.05,1.3,.94],reward:15},
 {name:'APPLE',skin:'#d92f36',inside:'#ffe3a1',shape:[1.12,1.08,1.05],reward:18},
 {name:'ORANGE',skin:'#ff8a16',inside:'#ffc34d',shape:[1.12,1.12,1.12],reward:20},
 {name:'BANANA',skin:'#f5d33e',inside:'#fff0a1',shape:[.8,1.25,.8],reward:22},
 {name:'KIWI',skin:'#806044',inside:'#8dc65b',shape:[1.05,1.05,1.05],reward:25},
 {name:'PEAR',skin:'#9ebd36',inside:'#ffe79a',shape:[.94,1.25,.9],reward:28},
 {name:'DRAGON FRUIT',skin:'#e64b86',inside:'#f4d9ee',shape:[1.1,1.2,1.02],reward:30},
 {name:'WATERMELON',skin:'#278d4b',inside:'#f45b62',shape:[1.22,1.12,1.22],reward:35}
];

let scene,camera,renderer,fruitGroup,fruitMesh,knifeGroup,river;
let coins=0,level=1,index=0,knifeLevel=1;
let dragging=false,last=null,dragMode='',coverage,covered=0,finishLock=false;
let audio=null,riverNoise=null,riverGain=null;
let clock,peelBits=[];
const W=256,H=128,COLS=64,ROWS=32;
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

let mapCanvas,mapCtx,skinTexture;
function resize(){
  if(!camera || !renderer) return;

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
}
function init(){

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x263a43);
 scene.fog=new THREE.Fog(0x263a43,18,40);

 camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);
 camera.position.set(0,8.5,14.5);
 camera.lookAt(0,1.35,0);

 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputEncoding=THREE.sRGBEncoding;

 scene.add(new THREE.HemisphereLight(0xffffff,0x60452e,1.4));

 const sun=new THREE.DirectionalLight(0xffe7c6,1.6);
 sun.position.set(-5,10,7);
 sun.castShadow=true;
 scene.add(sun);

 const fillLight=new THREE.PointLight(0x7ce6ed,1.1,20);
 fillLight.position.set(4,5,-4);
 scene.add(fillLight);

 // Kitchen floor
 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({color:0xc1b49c,roughness:.9})
 );
 floor.rotation.x=-Math.PI/2;
 floor.position.y=-.5;
 scene.add(floor);

 // Wooden chopping board
 const board=new THREE.Mesh(
  new THREE.BoxGeometry(7,.22,4.4),
  new THREE.MeshStandardMaterial({color:0x9c6038,roughness:.8})
 );
 board.position.set(0,.15,0);
 board.receiveShadow=true;
 board.castShadow=true;
 scene.add(board);

 for(let i=0;i<9;i++){
  const line=new THREE.Mesh(
   new THREE.BoxGeometry(6.9,.012,.025),
   new THREE.MeshStandardMaterial({color:0x6d4128})
  );
  line.position.set(0,.27,-1.9+i*.48);
  scene.add(line);
 }

 // River behind the cutting board
 const waterMat=new THREE.MeshStandardMaterial({
  color:0x65cbd1,
  roughness:.2,
  metalness:.15,
  transparent:true,
  opacity:.92
 });

 river=new THREE.Mesh(
  new THREE.PlaneGeometry(13,3.1,32,12),
  waterMat
 );
 river.rotation.x=-Math.PI/2;
 river.position.set(0,.0,-4.2);
 scene.add(river);

 // River banks
 for(let z of [-5.85,-2.55]){
  const bank=new THREE.Mesh(
   new THREE.BoxGeometry(13,.45,.22),
   new THREE.MeshStandardMaterial({color:0x72685a})
  );
  bank.position.set(0,.02,z);
  scene.add(bank);
 }

 // River shine lines
 for(let i=0;i<22;i++){
  const line=new THREE.Mesh(
   new THREE.BoxGeometry(.6+Math.random()*1.5,.015,.025),
   new THREE.MeshBasicMaterial({color:0xc9ffff,transparent:true,opacity:.45})
  );
  line.position.set(-6+Math.random()*12,.035,-5.6+Math.random()*2.7);
  line.userData.speed=.5+Math.random();
  scene.add(line);
 }

 // Background potatoes
 for(let i=0;i<23;i++){
  const potato=new THREE.Mesh(
   new THREE.SphereGeometry(.48,16,12),
   new THREE.MeshStandardMaterial({color:0xb47b43,roughness:.9})
  );
  potato.position.set(-5+(i%7)*1.65,1+Math.floor(i/7)*.4,-7+Math.floor(i/7)*.55);
  potato.scale.set(1,.8,1.15);
  scene.add(potato);
 }

 fruitGroup=new THREE.Group();
 scene.add(fruitGroup);

 knifeGroup=createKnife();
 scene.add(knifeGroup);

 loadFruit();

 clock=new THREE.Clock();

 addEventListener('resize',resize);
 animate();
}

function createKnife(){

 const g=new THREE.Group();

 const handle=new THREE.Mesh(
  new THREE.CylinderGeometry(.12,.15,.95,16),
  new THREE.MeshStandardMaterial({color:0x75513b,roughness:.65})
 );
 handle.rotation.z=-Math.PI/2;
 handle.position.x=.6;
 g.add(handle);

 const metal=new THREE.Mesh(
  new THREE.BoxGeometry(.8,.10,.20),
  new THREE.MeshStandardMaterial({color:0xc9d2d5,metalness:.8,roughness:.2})
 );
 metal.position.x=-.18;
 g.add(metal);

 const blade=new THREE.Mesh(
  new THREE.BoxGeometry(.58,.035,.18),
  new THREE.MeshStandardMaterial({color:0xf4f7f8,metalness:.9,roughness:.12})
 );
 blade.position.set(-.38,-.065,0);
 g.add(blade);

 const edge=new THREE.Mesh(
  new THREE.BoxGeometry(.58,.018,.19),
  new THREE.MeshStandardMaterial({color:0x777f86,metalness:.9})
 );
 edge.position.set(-.38,-.085,0);
 g.add(edge);

 g.position.set(1.3,2.7,1.1);
 g.rotation.z=-.15;
 return g;
}

function makeGeometry(d){

 const g=new THREE.SphereGeometry(1,72,56);
 const p=g.attributes.position;

 for(let i=0;i<p.count;i++){
  let x=p.getX(i),y=p.getY(i),z=p.getZ(i);

  if(d.name==='MANGO'){
   x*=1+.13*y;
   z*=.95;
  }
  if(d.name==='APPLE'){
   x*=1-.1*Math.max(0,y);
   z*=1-.1*Math.max(0,y);
  }
  if(d.name==='PEAR'){
   x*=1-.32*y;
   z*=1-.32*y;
  }
  if(d.name==='BANANA'){
   x+=.18*Math.sin(y*2.3);
  }
  p.setXYZ(i,x,y,z);
 }

 g.computeVertexNormals();
 return g;
}

function loadFruit(){

 clearFruit();

 const d=fruits[index%fruits.length];

 mapCanvas=document.createElement('canvas');
 mapCanvas.width=W;
 mapCanvas.height=H;
 mapCtx=mapCanvas.getContext('2d');

 mapCtx.fillStyle=d.skin;
 mapCtx.fillRect(0,0,W,H);

 for(let i=0;i<1000;i++){
  mapCtx.fillStyle='rgba(255,255,255,'+(Math.random()*.06)+')';
  mapCtx.beginPath();
  mapCtx.arc(Math.random()*W,Math.random()*H,Math.random()*1.5,0,Math.PI*2);
  mapCtx.fill();
 }

 skinTexture=new THREE.CanvasTexture(mapCanvas);
 skinTexture.encoding=THREE.sRGBEncoding;

 fruitMesh=new THREE.Mesh(
  makeGeometry(d),
  new THREE.MeshStandardMaterial({map:skinTexture,roughness:.4})
 );

 fruitMesh.scale.set(...d.shape);
 fruitMesh.position.y=1.55;
 fruitMesh.castShadow=true;
 fruitMesh.receiveShadow=true;
 fruitGroup.add(fruitMesh);

 const stem=new THREE.Mesh(
  new THREE.CylinderGeometry(.04,.06,.25,10),
  new THREE.MeshStandardMaterial({color:0x65452c})
 );
 stem.position.set(0,1.55+d.shape[1],0);
 fruitGroup.add(stem);

 const leaf=new THREE.Mesh(
  new THREE.SphereGeometry(.22,12,8),
  new THREE.MeshStandardMaterial({color:0x3f9c4d})
 );
 leaf.scale.set(1,.16,.42);
 leaf.position.set(.2,1.55+d.shape[1]+.1,0);
 fruitGroup.add(leaf);

 coverage=new Uint8Array(COLS*ROWS);
 covered=0;
 finishLock=false;
 fruitGroup.position.set(0,0,0);
 fruitGroup.rotation.set(0,0,0);
 knifeGroup.visible=true;

 $('fruitName').textContent=d.name+' · FRUIT '+String(index+1).padStart(2,'0');
 $('fill').style.width='0%';
 $('tip').textContent='👆 DRAG THE KNIFE ACROSS THE FRUIT';
 updateHUD();
}

function clearFruit(){
 while(fruitGroup.children.length){
  const o=fruitGroup.children.pop();
  if(o.geometry)o.geometry.dispose();
  if(o.material){
   if(o.material.map)o.material.map.dispose();
   o.material.dispose();
  }
 }
 peelBits.forEach(p=>{
  scene.remove(p.mesh);
  p.mesh.geometry.dispose();
  p.mesh.material.dispose();
 });
 peelBits=[];
}

function updateHUD(){
 $('coins').textContent=coins;
 $('level').textContent=String(level).padStart(2,'0');
 $('knifeLevel').textContent='LV '+knifeLevel+' · '+(knifeLevel*50)+' 🪙';
}

function getHit(e){
 const r=canvas.getBoundingClientRect();
 pointer.x=((e.clientX-r.left)/r.width)*2-1;
 pointer.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObject(fruitMesh,false);
 return hits[0]||null;
}

function peel(uv){

 if(finishLock)return;

 const d=fruits[index%fruits.length];
 const u=((uv.x%1)+1)%1;
 const v=Math.max(0,Math.min(1,uv.y));
 const x=u*W,y=(1-v)*H;

 const radius=10+knifeLevel*1.7;

 mapCtx.fillStyle=d.inside;
 mapCtx.beginPath();
 mapCtx.arc(x,y,radius,0,Math.PI*2);
 mapCtx.fill();

 skinTexture.needsUpdate=true;

 const gx=Math.floor(u*COLS);
 const gy=Math.min(ROWS-1,Math.floor(v*ROWS));
 const gr=2+Math.floor(knifeLevel*.35);

 for(let yy=-gr;yy<=gr;yy++){
  for(let xx=-gr;xx<=gr;xx++){
   if(xx*xx+yy*yy>gr*gr)continue;
   let cx=(gx+xx+COLS)%COLS;
   let cy=gy+yy;
   if(cy<0||cy>=ROWS)continue;
   const id=cy*COLS+cx;
   if(!coverage[id]){
    coverage[id]=1;
    covered++;
   }
  }
 }

 const pct=Math.min(100,covered/coverage.length*100);
 $('fill').style.width=pct+'%';

 spawnPeel();
 playPeelSound();

if(pct>=93&&!finishLock)finishFruit();
}

function spawnPeel(){

 const d=fruits[index%fruits.length];

 const strip=new THREE.Mesh(
  new THREE.TorusGeometry(.10,.025,5,12,Math.PI*1.5),
  new THREE.MeshStandardMaterial({color:d.skin,roughness:.8})
 );

 strip.position.set(
  (Math.random()-.5)*1.5,
  1.1+Math.random()*.7,
  (Math.random()-.5)*1.3
 );

 scene.add(strip);

 peelBits.push({mesh:strip,life:2,vy:.025});
}

function finishFruit(){

 finishLock=true;

 const d=fruits[index%fruits.length];
 const reward=d.reward+knifeLevel*2;

 coins+=reward;
 updateHUD();

 $('toast').textContent='✨ FULLY PEELED! +'+reward+' COINS ✨';
 $('toast').classList.add('show');
 $('tip').textContent='🍊 YOUR CLEAN FRUIT IS GOING INTO THE RIVER!';

 playCompleteSound();

 // Fruit moves towards river, then disappears
 const start=performance.now();
 const duration=1800;
 const from=fruitGroup.position.clone();

 function moveToRiver(now){
  const t=Math.min(1,(now-start)/duration);
  const eased=t*t*(3-2*t);

  fruitGroup.position.lerpVectors(from,new THREE.Vector3(0,-.15,-4.1),eased);
  fruitGroup.rotation.x=eased*1.4;
  fruitGroup.rotation.z=eased*.8;
  fruitGroup.scale.setScalar(1-eased*.25);

  if(t<1){
   requestAnimationFrame(moveToRiver);
  }else{
   splash();
   knifeGroup.visible=false;

   setTimeout(()=>{
    $('toast').classList.remove('show');
    index++;
    if(index%3===0)level++;
    loadFruit();
    $('tip').textContent='👆 DRAG THE KNIFE ACROSS THE FRUIT';
   },850);
  }
 }
 requestAnimationFrame(moveToRiver);
}

function splash(){

 playSplashSound();

 for(let i=0;i<24;i++){
  const drop=new THREE.Mesh(
   new THREE.SphereGeometry(.045+Math.random()*.06,8,8),
   new THREE.MeshStandardMaterial({color:0xc5ffff,transparent:true,opacity:.8})
  );

  drop.position.set((Math.random()-.5)*1.2,.25,-4.1);
  scene.add(drop);

  peelBits.push({mesh:drop,life:1.2,vy:.035+Math.random()*.04});
 }
}

function upgradeKnife(){

 const cost=knifeLevel*50;

 if(coins<cost){
  $('toast').textContent='NOT ENOUGH COINS! 🪙';
  $('toast').classList.add('show');
  setTimeout(()=>$('toast').classList.remove('show'),900);
  return;
 }

 coins-=cost;
 knifeLevel++;
 updateHUD();
 playUpgradeSound();

 $('toast').textContent='🗡️ KNIFE UPGRADED!';
 $('toast').classList.add('show');
 setTimeout(()=>$('toast').classList.remove('show'),1000);
}

$('knifeUpgrade').addEventListener('click',upgradeKnife);

function audioInit(){

 if(audio){
  if(audio.state==='suspended')audio.resume();
  return;
 }

 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;

 audio=new AC();

 // Continuous soft river ambience
 const buffer=audio.createBuffer(1,audio.sampleRate*3,audio.sampleRate);
 const data=buffer.getChannelData(0);

 for(let i=0;i<data.length;i++){
  data[i]=(Math.random()*2-1)*.22;
 }

 riverNoise=audio.createBufferSource();
 riverNoise.buffer=buffer;
 riverNoise.loop=true;

 const filter=audio.createBiquadFilter();
 filter.type='lowpass';
 filter.frequency.value=550;

 riverGain=audio.createGain();
 riverGain.gain.value=.035;

 riverNoise.connect(filter);
 filter.connect(riverGain);
 riverGain.connect(audio.destination);
 riverNoise.start();
}

function tone(freq,duration,volume,type='sine'){

 if(!audio)return;

 const osc=audio.createOscillator();
 const gain=audio.createGain();

 osc.type=type;
 osc.frequency.setValueAtTime(freq,audio.currentTime);
 gain.gain.setValueAtTime(volume,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);

 osc.connect(gain);
 gain.connect(audio.destination);

 osc.start();
 osc.stop(audio.currentTime+duration);
}

function playPeelSound(){
 if(!audio)return;
 tone(500+Math.random()*180,.08,.025,'sawtooth');
}

function playSplashSound(){
 if(!audio)return;
 tone(180,.35,.12,'sine');
 tone(420,.18,.05,'triangle');
}

function playCompleteSound(){
 if(!audio)return;
 tone(660,.18,.07);
 setTimeout(()=>tone(880,.25,.07),120);
}

function playUpgradeSound(){
 if(!audio)return;
 tone(500,.12,.07);
 setTimeout(()=>tone(850,.2,.07),100);
}

function startDrag(e){

 if(!$('welcome').classList.contains('hide') || finishLock) return;

 audioInit();
 dragging=true;
 last={x:e.clientX,y:e.clientY};

 const r=canvas.getBoundingClientRect();
 const y=(e.clientY-r.top)/r.height;

 if(y>0.58){
   dragMode='rotate';
   knifeGroup.visible=false;
 }else{
   dragMode='peel';
   knifeGroup.visible=true;
   const hit=getHit(e);
   if(hit){
     moveKnife(e);
     peel(hit.uv);
   }
 }
}

function moveKnife(e){

 const r=canvas.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width;
 const y=(e.clientY-r.top)/r.height;

 knifeGroup.position.set(
  (x-.5)*5,
  2.7+(0.5-y)*3,
  1.05
 );

 knifeGroup.rotation.z=-.15+(x-.5)*.3;
}

function moveDrag(e){

  if(!dragging || finishLock) return;

  const dx=e.clientX-last.x;
  const dy=e.clientY-last.y;

  if(dragMode==='rotate'){

    // Only rotate fruit from below
    fruitGroup.rotation.y += dx*.008;
    fruitGroup.rotation.x += dy*.004;

  }else if(dragMode==='peel'){

    // Only move knife and peel from above
    moveKnife(e);

    const hit=getHit(e);

    if(hit){
      peel(hit.uv);
    }
  }

  last={x:e.clientX,y:e.clientY};
   }

function endDrag(){
 dragging=false;
 last=null;
}

canvas.addEventListener('pointerdown',startDrag);
canvas.addEventListener('pointermove',moveDrag);
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

$('play').onclick=()=>{
 $('welcome').classList.add('hide');
 audioInit();
};

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.05);
 const t=clock.elapsedTime;

 // Flowing river surface
 if(river){
  const p=river.geometry.attributes.position;
  for(let i=0;i<p.count;i++){
   const x=p.getX(i),y=p.getY(i);
   p.setZ(i,Math.sin(x*2+t*2+y)*.035);
  }
  p.needsUpdate=true;
  river.geometry.computeVertexNormals();
 }

 // Falling peel and splash particles
 peelBits=peelBits.filter(p=>{
  p.life-=dt;
  p.mesh.position.y-=p.vy;
  p.mesh.position.x+=Math.sin(t*5)*.004;
  p.mesh.rotation.x+=dt*2;

  if(p.life<=0){
   scene.remove(p.mesh);
   p.mesh.geometry.dispose();
   p.mesh.material.dispose();
   return false;
  }
  return true;
 });

 if(fruitGroup&&!finishLock&&!dragging){
  fruitGroup.position.y=Math.sin(t*1.5)*.025;
 }

 renderer.render(scene,camera);
}

init();

})();
</script>
