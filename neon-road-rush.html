
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Road Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050817;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;z-index:3;pointer-events:none}
.pill{padding:9px 11px;border:1px solid #00eaff;border-radius:13px;background:#06152ddd;color:white;font-weight:900;font-size:12px;box-shadow:0 0 15px #00dfff66;text-shadow:0 0 8px #00eaff}
#pause{position:fixed;right:12px;top:60px;z-index:4;padding:10px 14px;border-radius:12px;border:1px solid #00eaff;background:#08152bee;color:white;font-weight:bold}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:4;pointer-events:none}
.ctrl{pointer-events:auto;width:74px;height:66px;border:2px solid #40f5ff;border-radius:18px;background:linear-gradient(145deg,#18365c,#071326);color:white;font-size:28px;font-weight:bold;box-shadow:0 0 20px #00dfff77}
#overlay{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:22px;background:#020817aa}
.panel{width:min(440px,100%);padding:28px 22px;text-align:center;color:white;border-radius:25px;background:linear-gradient(145deg,#102d56f5,#050b20f5);border:1px solid #00eaff;box-shadow:0 0 35px #00cfff66}
h1{margin:0 0 12px;font-size:clamp(34px,9vw,48px);line-height:1;color:white;text-shadow:0 0 10px #00eaff,0 0 25px #007bff}
.panel p{line-height:1.5;color:#c8eaff;margin:12px 0 20px}
#start{border:0;border-radius:15px;padding:15px 27px;font-size:19px;font-weight:1000;color:#071326;background:linear-gradient(135deg,#fff45b,#00f5ff);box-shadow:0 0 25px #00eaff99}
.small{font-size:12px;color:#9bc8e8!important}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<div class="pill">SCORE <span id="score">0</span></div>
<div class="pill">COINS <span id="coins">0</span></div>
<div class="pill">SPEED <span id="speed">1.0</span>x</div>
</div>
<button id="pause">Ⅱ PAUSE</button>
<div id="controls">
<button class="ctrl" id="left">◀</button>
<button class="ctrl" id="right">▶</button>
</div>
<div id="overlay">
<div class="panel">
<h1>NEON<br>ROAD RUSH</h1>
<p>Dodge traffic, collect glowing coins and survive the neon highway. Swipe or use the arrow buttons to change lanes.</p>
<button id="start">▶ START RACE</button>
<p class="small">3D ARCADE • MOBILE CONTROLS • ENDLESS RUN</p>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
if(!window.THREE){
$('overlay').innerHTML='<div class="panel"><h1>3D ENGINE FAILED</h1><p>Internet connection is required. Reload when online.</p></div>';
return;
}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050817);
scene.fog=new THREE.Fog(0x050817,28,115);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
camera.position.set(0,7.2,13.5);
camera.lookAt(0,1,-8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x8edfff,0x15102d,1.7));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,12,8);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);
const glow1=new THREE.PointLight(0x00eaff,22,35);
glow1.position.set(-7,4,-15);
scene.add(glow1);
const glow2=new THREE.PointLight(0xff168c,18,35);
glow2.position.set(7,3,-25);
scene.add(glow2);
const M=(c,metal=0,rough=.4,em=0)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough,emissive:em});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,180),M(0x080d20,.1,.9));
floor.rotation.x=-Math.PI/2;
floor.position.set(0,-.16,-48);
floor.receiveShadow=true;
scene.add(floor);
const road=new THREE.Mesh(new THREE.BoxGeometry(10,.3,150),M(0x101a34,.45,.65));
road.position.set(0,0,-55);
road.receiveShadow=true;
scene.add(road);
for(const x of [-5.12,5.12]){
const rail=new THREE.Mesh(new THREE.BoxGeometry(.22,.55,150),M(0x172b50,.6,.3,0x052d55));
rail.position.set(x,.32,-55);
scene.add(rail);
const line=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,150),M(0x00eaff,0,.3,0x00dfff));
line.position.set(x,.63,-55);
scene.add(line);
}
const dashes=[];
for(let z=8;z>-125;z-=8){
for(const x of [-1.67,1.67]){
const d=new THREE.Mesh(new THREE.BoxGeometry(.055,.025,3.1),M(0x00eaff,.2,.3,0x006d88));
d.position.set(x,.17,z);
scene.add(d);
dashes.push(d);
}}
for(let i=0;i<42;i++){
const side=i%2?1:-1,z=-(i*5+5),h=2+Math.random()*10,w=1.3+Math.random()*2;
const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),M(i%3?0x111d3b:0x24163d,.35,.6));
b.position.set(side*(8+Math.random()*7),h/2-.1,z);
scene.add(b);
for(let j=0;j<4;j++){
const win=new THREE.Mesh(new THREE.BoxGeometry(.08,.16,.08),M(j%2?0x00eaff:0xff3aa9,0,.3,j%2?0x00dfff:0xff168c));
win.position.set(b.position.x-side*(w/2+.045),.5+j*.55,z+w*.51);
scene.add(win);
}}
function car(color,player=false){
const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.25,.48,2.1),M(color,.65,.25,player?0x003b55:0));
body.position.y=.62;
body.castShadow=true;
g.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(.9,.48,1.05),M(player?0x172e50:0x303b55,.65,.18));
cabin.position.set(0,1.03,-.12);
g.add(cabin);
const glass=new THREE.Mesh(new THREE.BoxGeometry(.78,.3,.06),M(0x75eaff,.7,.12,0x075b80));
glass.position.set(0,1.05,.42);
g.add(glass);
for(const x of [-.68,.68]){
for(const z of [-.65,.65]){
const w=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.16,16),M(0x070a13,.1,.85));
w.rotation.z=Math.PI/2;
w.position.set(x,.35,z);
g.add(w);
}}
for(const x of [-.42,.42]){
const lamp=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.06),M(0xffffff,0,.2,0xffffff));
lamp.position.set(x,.66,1.08);
g.add(lamp);
}
return g;
}
const player=car(0x00dfff,true);
player.position.set(0,0,5);
scene.add(player);
let lane=1,targetX=0,score=0,coins=0,speed=1,running=false,paused=false,over=false;
const lanes=[-3.1,0,3.1],traffic=[],coinItems=[];
function addTraffic(z){
const l=Math.floor(Math.random()*3);
const v=car([0xff315d,0xffa52e,0x9b5cff,0x45ff8a][Math.floor(Math.random()*4)]);
v.position.set(lanes[l],0,z);
scene.add(v);
traffic.push({mesh:v,lane:l});
}
function addCoin(z){
const l=Math.floor(Math.random()*3);
const c=new THREE.Mesh(new THREE.TorusGeometry(.42,.13,10,24),M(0xffdf45,.65,.2,0xffa900));
c.position.set(lanes[l],1.35,z);
c.rotation.x=Math.PI/2;
scene.add(c);
coinItems.push(c);
}
for(let i=0;i<7;i++)addTraffic(-35-i*19);
for(let i=0;i<9;i++)addCoin(-22-i*17);
function move(d){
if(!running||paused||over)return;
lane=Math.max(0,Math.min(2,lane+d));
targetX=lanes[lane];
}
$('left').onpointerdown=e=>{e.preventDefault();move(-1)};
$('right').onpointerdown=e=>{e.preventDefault();move(1)};
let sx=null;
renderer.domElement.addEventListener('pointerdown',e=>sx=e.clientX);
renderer.domElement.addEventListener('pointerup',e=>{
if(sx===null)return;
const dx=e.clientX-sx;
if(Math.abs(dx)>25)move(dx>0?1:-1);
sx=null;
});
$('start').onclick=()=>{
score=0;coins=0;speed=1;lane=1;targetX=0;over=false;running=true;paused=false;
$('overlay').style.display='none';
$('pause').textContent='Ⅱ PAUSE';
};
$('pause').onclick=()=>{
if(!running||over)return;
paused=!paused;
$('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';
};
function endGame(){
running=false;over=true;
$('overlay').style.display='flex';
$('overlay').innerHTML=`<div class="panel"><h1>RACE OVER</h1><p>Score: <b>${score}</b><br>Coins: <b>${coins}</b></p><button id="start">↻ RACE AGAIN</button><p class="small">Beat your best score next time!</p></div>`;
$('start').onclick=()=>location.reload();
}
let last=performance.now(),spawn=0,coinSpawn=0;
function tick(now){
requestAnimationFrame(tick);
const dt=Math.min((now-last)/16.67,2);
last=now;
if(running&&!paused){
speed=Math.min(2.8,speed+dt*.0009);
score+=Math.max(1,Math.floor(speed*dt));
$('score').textContent=score;
$('coins').textContent=coins;
$('speed').textContent=speed.toFixed(1);
player.position.x+=(targetX-player.position.x)*Math.min(1,.18*dt);
player.rotation.z=(targetX-player.position.x)*-.07;
player.position.y=Math.sin(now*.008)*.025;
for(const d of dashes){
d.position.z+=.85*speed*dt;
if(d.position.z>12)d.position.z=-125;
}
for(const t of traffic){
t.mesh.position.z+=.42*speed*dt;
if(t.mesh.position.z>12){
t.mesh.position.z=-110-Math.random()*35;
t.lane=Math.floor(Math.random()*3);
t.mesh.position.x=lanes[t.lane];
}
if(Math.abs(t.mesh.position.z-player.position.z)<1.65&&Math.abs(t.mesh.position.x-player.position.x)<1.15){
endGame();
break;
}}
for(const c of coinItems){
c.position.z+=.42*speed*dt;
c.rotation.z+=.07*dt;
if(c.position.z>12){
c.position.z=-130-Math.random()*30;
c.position.x=lanes[Math.floor(Math.random()*3)];
}
if(Math.abs(c.position.z-player.position.z)<1.4&&Math.abs(c.position.x-player.position.x)<1.25){
coins++;
c.position.z=-140-Math.random()*35;
}}
spawn+=dt;
if(spawn>Math.max(34,72/speed)){
addTraffic(-130-Math.random()*30);
spawn=0;
}
coinSpawn+=dt;
if(coinSpawn>95){
addCoin(-140-Math.random()*25);
coinSpawn=0;
}}
camera.position.x+=(player.position.x*.16-camera.position.x)*.025*dt;
camera.lookAt(player.position.x*.12,1,-8);
renderer.render(scene,camera);
}
requestAnimationFrame(tick);
addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
})();
</script>
</body>
</html>
